name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest ships Docker, so the Testcontainers-backed tests
      # (RedisQueueRepositoryTest / RedisQueueRepositoryIntegrationTest) run without any
      # extra service container. This is unit + light-integration only; ./mvnw test does
      # not run MessageServiceIT (that is failsafe/verify and needs a broker) by design.
      - name: Build and test
        run: ./mvnw -B test
