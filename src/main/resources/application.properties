# ==============================
# Credentials
# ==============================
# Supplied via environment variables; the defaults match the local docker-compose
# stack in ../infrastructure so a fresh clone runs with no extra setup. Override
# ARTEMIS_* and JOLOKIA_* anywhere the broker is not the throwaway local one.

# ==============================
# Artemis Configuration
# ==============================
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:admin}

# ==============================
# Server Configuration
# ==============================
server.port=8080

# ==============================
# Message Inspector Configuration
# ==============================
# The Dead Letter Queue "Move to DLQ" writes to. Defaults to the broker's real DLQ.
message-inspector.dlq-name=DLQ

# ==============================
# Auth (Phase 4) — JWT + in-memory users
# ==============================
# HMAC-SHA256 signing secret. Must be >= 32 bytes for HS256. This is a THROWAWAY dev
# default committed only so a fresh clone boots; override with MESSAGE_INSPECTOR_JWT_SECRET
# (a random 32+ byte value) anywhere real.
message-inspector.jwt.secret=${MESSAGE_INSPECTOR_JWT_SECRET:dev-only-insecure-secret-change-me-32bytes!!}
# In-memory account passwords. Dev defaults; override with env anywhere real.
message-inspector.users.admin-password=${MESSAGE_INSPECTOR_ADMIN_PASSWORD:admin}
message-inspector.users.user-password=${MESSAGE_INSPECTOR_USER_PASSWORD:jason}

# ==============================
# Spring Boot Configurations
# ==============================
spring.application.name=message-inspector
spring.main.allow-bean-definition-overriding=true
# Boot 4 speaks Jackson 3. This keeps the auto-configured JsonMapper's defaults as close as
# possible to the Jackson 2 mapper the Angular client was written against (property order,
# slash escaping, date formatting). See ADR 0008.
spring.jackson.use-jackson2-defaults=true
# Dev is the default profile so a fresh clone boots with Swagger and nothing in the local
# workflow changes. Any real deployment sets SPRING_PROFILES_ACTIVE to something else and
# thereby gets the secure-by-default base config below.
spring.profiles.default=dev

# ==============================
# Swagger OpenAPI Configuration
# ==============================
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
# Docs are OFF in the base config and switched on only by the dev profile
# (application-dev.properties). This is what makes the springdoc RetireJS findings
# suppressible: the bundled Swagger JS is not served outside dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==============================
# Logging Configuration
# ==============================
logging.level.org.apache.activemq=INFO
logging.level.org.springframework=INFO
logging.level.com.example.jmsinspector=DEBUG

# ==============================
# JMX Configuration
# ==============================
jolokia.url=http://localhost:8161/console/jolokia
jolokia.brokerName=0.0.0.0
jolokia.username=${JOLOKIA_USER:admin}
jolokia.password=${JOLOKIA_PASSWORD:admin}

# ==============================
# Redis Configuration
# ==============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
